name: fleetpulse_flutter
description: Vedanta FleetPulse - GPS Vehicle Tracking Flutter App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP / Networking
  http: ^1.2.0
  web_socket_channel: ^2.4.0

  # Maps
  flutter_map: ^6.0.0
  latlong2: ^0.9.0

  # State Management
  provider: ^6.1.0

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

  # Storage
  shared_preferences: ^2.2.0

  # Utilities
  intl: ^0.19.0
  geolocator: ^12.0.0
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
